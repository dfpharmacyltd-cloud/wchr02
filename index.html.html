<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>West-Coast Recruitment Mailer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✉️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet">
<!-- Libraries are loaded from this site first (works behind office firewalls), with public CDNs as backup -->
<script src="xlsx.full.min.js"></script>
<script>if(!window.XLSX)document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');</script>
<script>if(!window.XLSX)document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');</script>
<script src="config.js"></script>
<script src="supabase.min.js"></script>
<script>if(!window.supabase)document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>');</script>
<script src="msal-browser.min.js"></script>
<script>if(!window.msal)document.write('<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"><\/script>');</script>
<style>
:root{
  --navy:#393185;--blue:#008DD2;--sky:#00A0E3;
  --ink:#1D2140;--muted:#5D6382;--line:#DCE2EC;--bg:#F1F4F8;--surface:#fff;--soft:#F7F9FC;
  --ok:#17804F;--okbg:#E4F3EA;--warn:#8A5A0B;--warnbg:#FBF0DA;--err:#B42828;--errbg:#FBE8E8;
  --info:#0B6FA6;--infobg:#E2F1FA;--grey:#555B72;--greybg:#ECEEF4;--r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:'Archivo','Arial Narrow',Arial,sans-serif;font-stretch:88%;color:var(--navy);margin:0;line-height:1.2}
h1{font-size:24px;font-weight:750}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0 0 10px}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand img{width:100%;max-width:196px;display:block}
.brand-sub{font-family:Archivo,sans-serif;font-stretch:85%;font-weight:650;color:var(--blue);margin-top:10px;font-size:15px}
nav{padding:10px;flex:1;overflow:auto}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;margin-bottom:2px}
nav a:hover{background:var(--soft)}
nav a.on{background:#EAF0FA;color:var(--navy);box-shadow:inset 3px 0 0 var(--blue);font-weight:600}
.badge{font-size:12px;min-width:22px;padding:1px 7px;border-radius:10px;background:var(--navy);color:#fff;text-align:center;font-weight:600}
.badge.err{background:var(--err)}
.conn{margin:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--soft);font-size:13.5px}
.conn .state{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#A0A6BA;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:#D69A1B}.dot.err{background:var(--err)}
.conn .who{color:var(--muted);word-break:break-all;margin:4px 0 10px}
.conn .row{display:flex;gap:6px;flex-wrap:wrap}
.sim-note{margin-top:10px;padding:8px 10px;border-radius:6px;background:var(--warnbg);color:var(--warn);font-size:12.5px}

main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:18px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{flex:1}
.menu{display:none;border:1px solid var(--line);background:#fff;border-radius:6px;width:38px;height:38px;font-size:18px;cursor:pointer}
.top-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12.5px;padding:3px 10px;border-radius:12px;background:var(--greybg);color:var(--grey);font-weight:600;white-space:nowrap}
.chip.auto{background:var(--okbg);color:var(--ok)}
.chip.appr{background:var(--infobg);color:var(--info)}
.chip.sim{background:var(--warnbg);color:var(--warn)}
.view{padding:24px 28px 60px;max-width:1360px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#B9C3D6;background:var(--soft)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#2E2870}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.blue:hover{background:#0079B5}
.btn.danger{color:var(--err);border-color:#EBC4C4}
.btn.danger:hover{background:var(--errbg)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--blue);padding:4px 6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card + .card,.stack > * + *{margin-top:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.cols2 > .card + .card{margin-top:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:200px}

input[type=text],input[type=email],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{font:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid #CBD3E1;border-radius:6px;background:#fff;color:var(--ink)}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;resize:vertical}
.field{margin-bottom:14px}
.field > label,.lbl{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--navy)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
.grid th{text-align:left;font-weight:600;color:var(--muted);background:var(--soft);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:9px 12px;border-bottom:1px solid #EDF0F5;vertical-align:top}
.grid tr:last-child td{border-bottom:0}
.grid td.nowrap{white-space:nowrap}
.grid .acts{display:flex;gap:4px;flex-wrap:nowrap}
.grid.log td:nth-child(8){min-width:220px}.grid.log td:nth-child(10){min-width:200px}
.grid.log th:last-child,.grid.log td:last-child{position:sticky;right:0;background:#fff;box-shadow:-1px 0 0 var(--line)}.grid.log th:last-child{background:var(--soft)}
.err-text{color:var(--err);font-size:12.5px;max-width:280px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty h3{margin-bottom:6px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap;background:var(--greybg);color:var(--grey)}
.pill.Sent{background:var(--okbg);color:var(--ok)}
.pill.Failed{background:var(--errbg);color:var(--err)}
.pill.Pending{background:var(--infobg);color:var(--info)}
.pill.Queued{background:#E9F6F3;color:#0E6B5C}
.qbar{height:8px;border-radius:4px;background:var(--greybg);overflow:hidden;margin:10px 0 6px}.qbar i{display:block;height:100%;background:var(--blue)}
.pill.Processing{background:#EDE9FA;color:var(--navy)}
.pill.Duplicate{background:var(--warnbg);color:var(--warn)}
.pill.Skipped{background:var(--greybg);color:var(--grey)}
.pill.status{background:#EEF0FA;color:var(--navy)}

/* The stage rail: the one bold element */
.rail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.stage{padding:18px 18px 16px;border:0;border-right:1px solid var(--line);background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.stage:last-child{border-right:0}
.stage:hover{background:var(--soft)}
.stage .n{font-family:Archivo,sans-serif;font-stretch:75%;font-weight:800;font-size:46px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.stage:first-child .n{color:var(--blue)}
.stage .l{color:var(--muted);font-size:13px;margin-top:8px;font-weight:500}
.rules{height:9px;border-top:4px solid var(--navy);position:relative;margin-bottom:22px}
.rules::after{content:"";position:absolute;left:0;right:0;top:3px;border-top:2px solid var(--blue)}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .n{font-family:Archivo,sans-serif;font-stretch:85%;font-weight:700;font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stat.bad .n{color:var(--err)}

.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EDF0F5;font-size:13.5px}
.feed li:last-child{border-bottom:0}
.feed .when{color:var(--muted);white-space:nowrap;font-size:12.5px}
.arrow{color:var(--muted);margin:0 4px}

.setup{border-left:4px solid var(--blue)}
.setup ol{margin:8px 0 0;padding-left:20px}
.setup li{padding:4px 0}
.setup li.done{color:var(--muted);text-decoration:line-through}

.drop{border:2px dashed #B9C4D8;border-radius:var(--r);background:#fff;padding:40px 20px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--infobg)}
.drop h2{margin-bottom:6px}

.notice{padding:10px 14px;border-radius:6px;font-size:13.5px;margin-bottom:14px}
.notice.info{background:var(--infobg);color:#0A5A87}
.notice.warn{background:var(--warnbg);color:var(--warn)}
.notice.err{background:var(--errbg);color:var(--err)}
.notice.ok{background:var(--okbg);color:var(--ok)}

.modal-back{position:fixed;inset:0;background:rgba(25,27,55,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100}
.modal-back.open{display:flex}
.modal{background:#fff;border-radius:10px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(20,20,60,.25)}
.modal.wide{max-width:1180px}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.m-body{padding:20px 22px}
.m-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 10px 10px}
.m-foot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}

.meta{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:14px;margin-bottom:14px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;word-break:break-word;font-weight:500}
iframe.mail{width:100%;height:460px;border:1px solid var(--line);border-radius:6px;background:#fff}
.att{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.att span{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;border:1px solid var(--line);border-radius:14px;font-size:12.5px;background:var(--soft)}
.att button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.vars button{font:inherit;font-size:12px;padding:2px 8px;border-radius:5px;border:1px solid #CFD6E6;background:#F5F7FC;color:var(--navy);cursor:pointer;font-family:ui-monospace,Consolas,monospace}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:7px 0;color:var(--muted);counter-increment:s}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;background:#fff}
.steps li.active{color:var(--ink);font-weight:600}
.steps li.active::before{border-color:var(--blue);color:var(--blue)}
.steps li.done{color:var(--ink)}
.steps li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.fail::before{content:"!";background:var(--err);border-color:var(--err);color:#fff}
.steps .d{font-size:12.5px;color:var(--muted);font-weight:400}
.report{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.report div{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.report b{display:block;font-family:Archivo,sans-serif;font-stretch:85%;font-size:24px;color:var(--navy)}
.report span{font-size:12.5px;color:var(--muted)}

.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:380px}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}
.hide{display:none!important}
.rt-bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border:1px solid #CBD3E1;border-bottom:0;border-radius:6px 6px 0 0;background:var(--soft)}
.rt-bar button{font:inherit;font-size:13px;min-width:30px;height:30px;padding:0 8px;border:1px solid transparent;border-radius:5px;background:none;cursor:pointer;color:var(--ink)}
.rt-bar button:hover{background:#fff;border-color:var(--line)}
.rt-bar select{width:auto;height:30px;padding:2px 6px;font-size:13px}
.rt-bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.rt-area{min-height:340px;max-height:560px;overflow:auto;border:1px solid #CBD3E1;border-radius:0 0 6px 6px;padding:12px 14px;background:#fff;color:#000;line-height:1.35;outline:none}
.rt-area:focus{border-color:var(--blue)}
.rt-area p{margin:0}.rt-area ul,.rt-area ol{margin:0;padding-left:36px}
.rt-area table{border-collapse:collapse}.rt-area td,.rt-area th{border:1px solid #bbb;padding:4px 8px}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:300}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:400px}
.gate-card img{width:200px;display:block;margin-bottom:18px}
.gate-card h2{margin-bottom:6px}
.chip.sync-ok{background:var(--okbg);color:var(--ok)}.chip.sync-saving{background:var(--infobg);color:var(--info)}.chip.sync-error{background:var(--errbg);color:var(--err)}
.mode-opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;margin-bottom:10px}
.mode-opt.on{border-color:var(--navy);background:#F4F3FB}
.mode-opt input{margin-top:4px;accent-color:var(--navy)}
.mode-opt.disabled{opacity:.55;cursor:not-allowed}

@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.rail{grid-template-columns:repeat(4,minmax(0,1fr))}.stage{border-bottom:1px solid var(--line)}.ed{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .menu{display:inline-block}
  .top{padding:14px 16px}.view{padding:18px 16px 50px}
  .cols2,.fgrid{grid-template-columns:1fr}
  .rail{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats,.report{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top-meta .chip.role{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img id="brandLogo" alt="West-Coast Pharmaceutical Works Ltd."><div class="brand-sub">Recruitment Mailer</div></div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="conn" id="conn"></div>
  </aside>
  <main>
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="Open menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="top-meta" id="topMeta"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
"use strict";
/* ============================================================
   West-Coast Recruitment Mailer

function fmtDate(d){ return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
function fmtTime(d){ let h = d.getHours(); const m = d.getMinutes(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + pad(m) + " " + ap; }
function fmtDT(ts){ if(!ts) return ""; const d = new Date(ts); return pad(d.getDate()) + " " + MONTHS[d.getMonth()].slice(0,3) + " " + d.getFullYear() + ", " + fmtTime(d); }
function fmtD(ts){ const d = new Date(ts); return pad(d.getDate()) + " " + MONTHS[d.getMonth()].slice(0,3) + " " + d.getFullYear(); }
function fmtT(ts){ return fmtTime(new Date(ts)); }
function isoDay(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function sameDay(a, b){ return isoDay(new Date(a)) === isoDay(new Date(b)); }
function sameMonth(a, b){ const x = new Date(a), y = new Date(b); return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth(); }

function toDate(v){
  if (v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === "number" && v > 20000){ const d = new Date(Math.round((Math.floor(v) - 25569) * 864e5)); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  const s = String(v ?? "").trim(); if (!s) return null;
  let m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
  if (m){ let y = +m[3]; if (y < 100) y += 2000; const d = new Date(y, +m[2] - 1, +m[1]); return isNaN(d) ? null : d; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  const t = Date.parse(s); if (isNaN(t)) return null; const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function toTime(v){
  if (v instanceof Date && !isNaN(v)) return fmtTime(v);
  if (typeof v === "number"){ const frac = v % 1; const mins = Math.round(frac * 1440) % 1440; return fmtTime(new Date(2000, 0, 1, Math.floor(mins / 60), mins % 60)); }
  const s = String(v ?? "").trim();
  const m = s.match(/^(\d{1,2})[:.](\d{2})(?::\d{2})?\s*([AaPp]\.?[Mm]\.?)?$/);
  if (m){ let h = +m[1]; const mi = +m[2]; if (m[3]){ const pm = /p/i.test(m[3]); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; } if (h < 24 && mi < 60) return fmtTime(new Date(2000, 0, 1, h, mi)); }
  return s;
}

const DB = {
  db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open("wc-recruitment-mailer", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  get(k){ return new Promise((res, rej) => { const q = this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v){ return new Promise((res, rej) => { const q = this.db.transaction("kv", "readwrite").objectStore("kv").put(v, k); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); },
  clear(){ return new Promise((res, rej) => { const q = this.db.transaction("kv", "readwrite").objectStore("kv").clear(); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); }
};

const TABLES = { candidates: "wc_candidates", log: "wc_email_log" };
const CLOUD = { on: false, sb: null, user: null, synced: { candidates: new Map(), log: new Map() }, kv: {}, lastPull: null, pushing: false, pulling: false, pending: new Set(), timer: null, state: "ok", err: "", lock: null };

function save(...ks){
  if (CLOUD.on){ ks.forEach(k => CLOUD.pending.add(k)); clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudPush, 700); return Promise.resolve(); }
  return Promise.all(ks.map(k => DB.set(k, S[k]))).catch(e => toast("Could not save data in this browser: " + e.message, "err"));
}
async function persistAll(){
  if (CLOUD.on){ KEYS.forEach(k => CLOUD.pending.add(k)); clearTimeout(CLOUD.timer); await cloudPush(); if (CLOUD.pending.size) throw new Error(CLOUD.err || "could not reach the shared database"); }
  else for (const k of KEYS) await DB.set(k, S[k]);
}
function setSync(state, err){ CLOUD.state = state; CLOUD.err = err || ""; if ($("#topMeta")) renderTop(); }
async function cloudPush(){
  if (!CLOUD.on) return;
  if (CLOUD.pushing || CLOUD.pulling){ clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudPush, 800); return; }
  const keys = [...CLOUD.pending]; CLOUD.pending.clear(); if (!keys.length) return;
  CLOUD.pushing = true; setSync("saving");
  try {
    for (const k of keys){ if (TABLES[k]) await pushTable(k); else await pushKv(k); }
    setSync(CLOUD.pending.size ? "saving" : "ok");
  } catch (e){
    keys.forEach(k => CLOUD.pending.add(k)); setSync("error", e.message || String(e));
    clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudPush, 15000);
  } finally { CLOUD.pushing = false; }
}
async function pushKv(k){
  const str = JSON.stringify(S[k] ?? null);
  if (CLOUD.kv[k] === str) return;
  const { error } = await CLOUD.sb.from("wc_kv").upsert({ key: k, value: S[k] ?? null });
  if (error) throw error;
  CLOUD.kv[k] = str;
}
function tableEntries(k){ return k === "candidates" ? Object.entries(S.candidates) : S.log.map(e => [e.id, e]); }
async function pushTable(k){
  const synced = CLOUD.synced[k], rows = [], strs = new Map(), seen = new Set();
  for (const [id, obj] of tableEntries(k)){ seen.add(id); const s = JSON.stringify(obj); if (synced.get(id) !== s){ rows.push({ id, data: obj }); strs.set(id, s); } }
  for (const [id, s] of synced) if (!seen.has(id) && s !== "__deleted"){ rows.push({ id, data: { _deleted: true } }); strs.set(id, "__deleted"); }
  const size = k === "log" ? 100 : 400;   // email rows carry the email text, so smaller chunks
  for (let i = 0; i < rows.length; i += size){
    const chunk = rows.slice(i, i + size);
    const { error } = await CLOUD.sb.from(TABLES[k]).upsert(chunk);
    if (error) throw error;
    chunk.forEach(r => synced.set(r.id, strs.get(r.id)));
  }
}
async function fetchAll(table, cols, since){
  let out = [], from = 0;
  for (;;){
    let q = CLOUD.sb.from(table).select(cols).order("updated_at", { ascending: true }).range(from, from + 999);
    if (since) q = q.gt("updated_at", since);
    const { data, error } = await q; if (error) throw error;
    out = out.concat(data); if (data.length < 1000) break; from += 1000;
  }
  return out;
}
const maxTs = (a, b) => (!a || (b && b > a)) ? b : a;
/* Bring in changes made on other computers. A local change that hasn't been saved yet always wins. */
async function cloudPull(full){
  if (!CLOUD.on || CLOUD.pushing || CLOUD.pulling || (!full && CLOUD.pending.size)) return false;
  CLOUD.pulling = true; let changed = false, latest = full ? null : CLOUD.lastPull;
  try {
    const since = full ? null : CLOUD.lastPull;
    for (const r of await fetchAll("wc_kv", "key,value,updated_at", since)){
      latest = maxTs(latest, r.updated_at);
      if (!KEYS.includes(r.key) || TABLES[r.key]) continue;
      const str = JSON.stringify(r.value ?? null), local = JSON.stringify(S[r.key] ?? null);
      if (full || CLOUD.kv[r.key] === undefined || local === CLOUD.kv[r.key]){ if (local !== str){ S[r.key] = r.value; changed = true; } CLOUD.kv[r.key] = str; }
    }
    for (const k of ["candidates","log"]){
      const synced = CLOUD.synced[k], idx = k === "log" ? new Map(S.log.map(e => [e.id, e])) : null; let logChanged = false;
      for (const r of await fetchAll(TABLES[k], "id,data,updated_at", since)){
        latest = maxTs(latest, r.updated_at);
        const str = r.data && r.data._deleted ? "__deleted" : JSON.stringify(r.data);
        const localObj = k === "candidates" ? S.candidates[r.id] : idx.get(r.id);
        const localStr = localObj ? JSON.stringify(localObj) : "__deleted";
        if (!(full || !synced.has(r.id) || synced.get(r.id) === localStr)) continue;
        synced.set(r.id, str);
        if (localStr === str) continue;
        changed = true; if (k === "log") logChanged = true;
        if (str === "__deleted"){ if (k === "candidates") delete S.candidates[r.id]; else { const i = S.log.indexOf(localObj); if (i >= 0) S.log.splice(i, 1); } }
        else if (k === "candidates") S.candidates[r.id] = r.data;
        else if (localObj){ Object.keys(localObj).forEach(x => delete localObj[x]); Object.assign(localObj, r.data); }
        else { S.log.push(r.data); idx.set(r.id, r.data); }
      }
      if (logChanged) S.log.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    }
    CLOUD.lastPull = latest; if (CLOUD.state === "error") setSync("ok");
  } catch (e){ setSync("error", e.message || String(e)); }
  finally { CLOUD.pulling = false; }
  return changed;
}
async function cloudLoad(){
  const meta = await CLOUD.sb.from("wc_kv").select("value").eq("key", "meta").maybeSingle();
  if (meta.error) throw meta.error;
  const localHasData = Object.keys(S.candidates).length > 0 || S.log.length > 0;
  if (!meta.data){
    if (!localHasData && !(await askStartEmpty())) return false;
    // This computer's data becomes the shared starting point
    CLOUD.on = true; await persistAll();
    const { error } = await CLOUD.sb.from("wc_kv").upsert({ key: "meta", value: { createdBy: myEmail(), createdOn: PC.id, at: Date.now() } });
    if (error) throw error;
    if (localHasData) toast("This computer's data is now shared with every HR computer.", "ok");
    return true;
  }
  if (localHasData && !PC.preSharedBackup){ const snap = {}; KEYS.forEach(k => snap[k] = S[k]); await DB.set("preSharedBackup", snap); PC.preSharedBackup = Date.now(); savePC(); }
  KEYS.forEach(k => { S[k] = undefined; }); S.candidates = {}; S.log = [];
  CLOUD.on = true;
  await cloudPull(true);
  if (CLOUD.state === "error") throw new Error(CLOUD.err);
  await applyDefaults();
  return true;
}

function redirectUri(){ return location.origin + location.pathname.replace(/[^/]*$/, "") + "redirect.html"; }
async function initMsal(){
  msalApp = null; account = null;
  if (!S.settings.clientId || !window.msal) return;
  try {
    msalApp = new msal.PublicClientApplication({
      auth: { clientId: S.settings.clientId.trim(), authority: "https://login.microsoftonline.com/" + (S.settings.tenant || "common").trim(), redirectUri: redirectUri() },
      cache: { cacheLocation: "localStorage" }
    });
    await msalApp.handleRedirectPromise().catch(() => null);
    const accts = msalApp.getAllAccounts();
    const want = (PC.connectedEmail || "").toLowerCase();
    account = accts.find(a => a.username.toLowerCase() === want) || null;
  } catch (e){ console.error(e); msalApp = null; }

async function connectOutlook(){
  if (!S.settings.clientId){ toast("Add your Microsoft application (client) ID in Settings first."); go("settings"); return; }
  if (!window.msal){ toast("The Microsoft sign-in library didn't load. Check your internet connection and reload.", "err"); return; }
  if (!msalApp) await initMsal();
  try {
    const r = await msalApp.loginPopup({ scopes: SCOPES, prompt: "select_account" });
    account = r.account; msalApp.setActiveAccount(account);
    let email = account.username, name = account.name || "";
    try {
      const tok = await getToken();
      const me = await (await fetch("https://graph.microsoft.com/v1.0/me?$select=displayName,mail,userPrincipalName", { headers: { Authorization: "Bearer " + tok } })).json();
      email = me.mail || me.userPrincipalName || email; name = me.displayName || name;
    } catch {}
    PC.connectedEmail = account.username; PC.connectedName = name; PC.mailboxEmail = email; savePC(); senderHeartbeat(); toast("Outlook connected: " + email, "ok"); renderAll();
  } catch (e){ toast("Outlook connection was not completed: " + (e.errorMessage || e.message || e), "err"); }
}
async function disconnectOutlook(){
  if (!confirm("Disconnect Outlook? Automatic sending stops until you connect again.")) return;
  try { if (msalApp && account) await msalApp.logoutPopup({ account, mainWindowRedirectUri: location.href.split("#")[0] }); } catch {}
  account = null; PC.connectedEmail = ""; PC.connectedName = ""; PC.mailboxEmail = ""; savePC(); toast("Outlook disconnected."); renderAll();
}
async function getToken(){
  if (!msalApp || !account) throw new Error("Outlook is not connected.");
  try { return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch (e){
    if (e instanceof msal.InteractionRequiredAuthError || /interaction_required|login_required|consent_required/.test(e.errorCode || "")) return (await msalApp.acquireTokenPopup({ scopes: SCOPES, account })).accessToken;
    throw e;
  }
}

    const val = vars[k];
    if (val === undefined || val === null || String(val).trim() === ""){ if (missing) missing.add(k); return ""; }
    return html ? esc(val) : String(val);

/* Word / Outlook lists arrive as paragraphs with fake bullets: turn them back into real lists */
function wordLists(root){
  const doc = root.ownerDocument;
  const isListP = el => el && el.tagName === "P" && /mso-list:\s*l\d+\s+level\d+/i.test(el.getAttribute("style") || "");
  const done = new Set();
  for (const p of [...root.querySelectorAll("p")]){
    if (done.has(p) || !isListP(p)) continue;
    const group = []; let el = p;
    while (isListP(el)){ group.push(el); done.add(el); el = el.nextElementSibling; }
    const anchor = doc.createElement("span"); group[0].before(anchor);
    let stack = [], top = null;
    for (const g of group){
      const lvl = +(/level(\d+)/i.exec(g.getAttribute("style"))[1]);
      const markers = [...g.querySelectorAll("span")].filter(s => /mso-list:\s*ignore/i.test(s.getAttribute("style") || ""));
      const mark = markers.map(s => s.textContent).join("").trim();
      markers.forEach(s => s.remove());
      const ordered = /^\(?([0-9]+|[a-zA-Z]|[ivxlcIVXLC]+)[.)]/.test(mark);
      while (stack.length && stack[stack.length - 1].level > lvl) stack.pop();
      if (!stack.length || stack[stack.length - 1].level < lvl){
        const list = doc.createElement(ordered ? "ol" : "ul");
        if (stack.length){ const last = stack[stack.length - 1].list.lastElementChild; (last || stack[stack.length - 1].list).appendChild(list); }
        else { top = list; anchor.before(list); }
        stack.push({ level: lvl, list });
      }
      const li = doc.createElement("li");
      while (g.firstChild) li.appendChild(g.firstChild);
      stack[stack.length - 1].list.appendChild(li); g.remove();
    }
    anchor.remove();
  }
}

      if (!ch.nodeValue.trim() && !ch.nodeValue.includes("\u00a0") && (blk(ch.previousSibling) || blk(ch.nextSibling))) ch.remove();
      continue;
    }
    if (ch.nodeType !== 1){ ch.remove(); continue; }
    const tag = ch.tagName.toUpperCase();
    if (DROP_TAGS.has(tag) || tag.includes(":") && tag !== "O:P" && !ch.textContent.trim()){ ch.remove(); continue; }
    cleanNode(ch);

    if (!KEEP_TAGS.has(tag) || ((tag === "B" || tag === "STRONG") && /font-weight:\s*(normal|400)/i.test(st))){ ch.replaceWith(...ch.childNodes); continue; }
    const keep = {};
    for (const a of [...ch.attributes]){
      const n = a.name.toLowerCase();

        const out = st.split(";").map(x => x.trim()).filter(x => { const k = x.split(":")[0].trim().toLowerCase(); return KEEP_STYLES.includes(k) && !/mso-|windowtext/i.test(x); }).join(";");

      else if (n === "face" && tag === "FONT") keep.face = a.value;
      else if (n === "color" && tag === "FONT") keep.color = a.value;
      else if (n === "align" && /^(P|DIV|TD|TH|TABLE|H\d)$/.test(tag)) keep.align = a.value;

/* ---------- sending ---------- */
async function deliver(e){
  if (!outlookReady()) throw new Error("Outlook is not connected. Connect Outlook, or turn on simulation mode in Settings.");
  if (!validEmail(e.to)) throw new Error("Invalid email address: " + (e.to || "(blank)"));
  const files = (e.attachments || []).map(id => S.files[id]).filter(Boolean);
  const total = files.reduce((a, f) => a + (f.size || 0), 0);
  if (total > MAX_FILE) throw new Error("Attachments total " + (total / 1048576).toFixed(1) + " MB; the limit is 3 MB per email.");
  if (isSim()){
    await sleep(300);
    if (/fail/i.test(e.to)) throw new Error("Simulated failure: recipient mailbox unavailable (test addresses containing \"fail\" always fail).");
    return;
  }
  const token = await getToken();
  const atts = files.map(f => ({ "@odata.type": "#microsoft.graph.fileAttachment", name: f.name, contentType: f.type || "application/octet-stream", contentBytes: f.b64 }));
  if (e.includeLogo && String(S.settings.logo).startsWith("data:")){
    const [meta, b64] = S.settings.logo.split(",");
    atts.push({ "@odata.type": "#microsoft.graph.fileAttachment", name: "logo.png", contentType: meta.slice(5).split(";")[0], contentBytes: b64, isInline: true, contentId: "companylogo" });
  }
  const message = { subject: e.subject, body: { contentType: "HTML", content: fullHtml(e, false) }, toRecipients: [{ emailAddress: { address: e.to, name: e.name || e.to } }], attachments: atts };
  const r = await fetch("https://graph.microsoft.com/v1.0/me/sendMail", { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify({ message, saveToSentItems: true }) });
  if (!r.ok){
    let msg = "Outlook returned HTTP " + r.status;
    try { const j = await r.json(); if (j.error) msg = j.error.code + ": " + j.error.message; } catch {}
    const err = new Error(msg);
    if (r.status === 429 || r.status === 503){ err.throttle = true; err.retryMs = Math.max(60, +(r.headers.get("Retry-After") || 60)) * 1000; }

}

/* ---------- batch sending queue: N emails every M minutes ---------- */
const Q = { running: false, throttleMs: 0, batchDone: 0, batchTotal: 0 };

  const ms = (Q.running ? 0 : start) + (batches - 1) * perBatchMs + Math.min(n, batchSize()) * gapMs();

  if (!isSim() && sentToday() >= (+S.settings.dailyCap || 10000)) return;
  const left = batchOn() ? windowState() : 1e9;
  if (!left){ renderQueueStatus(); return; }
  const batch = queuedList().slice(0, left);

      if (Q.throttleMs){ S.settings.holdUntil = Date.now() + Q.throttleMs; break; }
      Q.batchDone++; S.settings.windowCount = (S.settings.windowCount || 0) + 1;
      if (Q.batchDone % 10 === 0 || Q.batchDone === Q.batchTotal) await save("log", "history", "candidates", "schedule", "settings");
      renderQueueStatus(); renderNav();

const EMAIL_RE = /[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/;

    byKey.set(k, c);

    if (k.startsWith("id:")) continue;
    if (!S.idMap[k]){ S.idSeq = (S.idSeq || 0) + 1; S.idMap[k] = "WC" + String(S.idSeq).padStart(5, "0"); changedMap = true; }

function isReminderStatus(s){ return sameStatus(s, "Interview Scheduled"); }

}

  S.schedule.forEach(s => { if (s.candId === id && s.status === "Scheduled" && (!want || s.iso !== c._iso)) { s.status = "Cancelled"; s.note = want ? "Interview date changed" : "Status changed to " + (c["Candidate Status"] || "blank"); } });

/* Compare incoming rows with the saved snapshot and prepare emails. Returns { report, toSend, entries } */
function ingest(rows, { baseline = false, hold = false, uploadId = "", source = "Excel upload" } = {}){
  const rep = { total: rows.length, dupRows: 0, newC: 0, changes: 0, sent: 0, failed: 0, dup: 0, skipped: 0, pending: 0, invalid: 0, noTemplate: 0 };
  const entries = [], seen = new Set();
  for (const c of rows){
    const id = String(c["Candidate ID"] || "").trim();
    if (!id){ rep.skipped++; continue; }
    if (seen.has(id)) { rep.skipped++; continue; }
    seen.add(id); c["Candidate ID"] = id;
    const prev = S.candidates[id];
    const newStatus = c["Candidate Status"] || (prev ? prev["Candidate Status"] : "") || S.settings.defaultStatus || "Application Received";
    c["Candidate Status"] = newStatus;
    let trig = null;
    if (!prev){ rep.newC++; trig = { from: null, to: newStatus }; }
    else if (!sameStatus(prev["Candidate Status"], newStatus)){ rep.changes++; trig = { from: prev["Candidate Status"], to: newStatus }; }
    const merged = Object.assign({}, prev || {}, c);
    for (const k of SYSTEM_COLS) if (prev && prev[k] !== undefined) merged[k] = prev[k];
    merged._updatedAt = Date.now(); if (!prev) merged._createdAt = Date.now();
    if (trig && !baseline) merged._statusAt = Date.now();
    if (trig && uploadId){ merged._uploadId = uploadId; merged._uploadKind = prev ? "changed" : "new"; }
    S.candidates[id] = merged;
    syncSchedule(merged);
    if (!trig) continue;
    S.updates.unshift({ ts: Date.now(), candId: id, name: merged["Candidate Name"], from: trig.from, to: trig.to, source });
    if (baseline) continue;
    if (hold){ rep.held = (rep.held || 0) + 1; continue; }
    const t = templateFor(merged, newStatus);
    if (!t){
      rep.noTemplate++; rep.skipped++;
      const e = { id: uid("em"), ts: Date.now(), candId: id, name: merged["Candidate Name"], to: merged["Email ID"], status: newStatus, templateId: "", templateName: "—", subject: "", body: "", signature: "", includeLogo: false, attachments: [], emailStatus: "Skipped", error: "No active email template is assigned to status \"" + newStatus + "\".", trigger: trig.from ? "Status change" : "New candidate", dupKey: "" };
      addLog(e); entries.push(e); continue;
    }
    const e = buildDraft(merged, t, newStatus, trig.from ? "Status change: " + trig.from + " → " + trig.to : "New candidate");
    if (!validEmail(e.to)){ e.emailStatus = "Skipped"; e.error = "Invalid email address: " + (e.to || "(blank)"); rep.invalid++; rep.skipped++; addLog(e); markCand(e); entries.push(e); continue; }
    const hist = S.history[e.dupKey];
    const pendingSame = S.log.find(x => x.dupKey === e.dupKey && (x.emailStatus === "Pending" || x.emailStatus === "Queued"));
    if (hist || pendingSame){ e.emailStatus = "Duplicate Prevented"; e.error = hist ? "Already sent on " + fmtDT(hist.sentAt) + "." : "An identical email is already waiting to be sent."; rep.dup++; addLog(e); entries.push(e); continue; }
    addLog(e); entries.push(e);
  }
  if (S.updates.length > 500) S.updates.length = 500;
  const toSend = entries.filter(e => e.emailStatus === "Pending");
  return { rep, entries, toSend };
}

/* ---------- scheduler (interview reminders) ---------- */
let tickBusy = false;
async function tick(){
  if (tickBusy || !isSender()) return; tickBusy = true;
  try {
    const now = Date.now(); let changed = false; const send = [];
    for (const s of S.schedule){
      if (s.status !== "Scheduled" || s.dueAt > now) continue;
      const c = S.candidates[s.candId];
      if (!c){ s.status = "Cancelled"; s.note = "Candidate removed"; changed = true; continue; }
      if (new Date(s.iso + "T23:59:59").getTime() < now){ s.status = "Expired"; s.note = "Interview date passed before the reminder could be sent"; changed = true; continue; }
      const t = templateFor({ ...c, "Email Template": "" }, "Interview Reminder");
      if (!t){ s.status = "Cancelled"; s.note = "No active template for Interview Reminder"; changed = true; continue; }
      const e = buildDraft(c, t, "Interview Reminder", "Scheduled reminder", s.iso);
      s.logId = e.id; changed = true;
      if (S.history[e.dupKey]){ e.emailStatus = "Duplicate Prevented"; e.error = "Reminder already sent."; addLog(e); s.status = "Done"; continue; }
      addLog(e);
      if (autoOn() && outlookReady()){ send.push(e); s.status = "Done"; }
      else { s.status = "Queued"; s.note = "Waiting in approval queue"; }
    }
    if (send.length) await dispatch(send);
    if (changed){ await save("schedule", "log", "history", "candidates"); renderAll(); }
  } finally { tickBusy = false; }
}

async function importExcel(file){
  if (!guard("operate")) return;
  if (!window.XLSX){ toast("The Excel reader didn't load. Make sure xlsx.full.min.js is uploaded to Vercel next to index.html, then press Ctrl+F5.", "err"); return; }
  const upEl = $('input[name="upMode"]:checked'), mode = upEl ? upEl.value : "auto";
  const baseline = mode === "baseline", hold = mode === "select", uploadId = uid("up");
  if (!baseline){ S.settings.uploadMode = mode; save("settings"); }
  UI.busy = true; stepsModal("Processing " + file.name);
  try {
    step(0, "active");
    const isCsv = /\.csv$/i.test(file.name);
    const wb = XLSX.read(await file.arrayBuffer(), isCsv ? { type: "array", raw: true, codepage: 65001 } : { type: "array", cellDates: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { defval: "", raw: true });
    const headers = (XLSX.utils.sheet_to_json(ws, { header: 1, range: 0 })[0] || []).map(String);
    step(0, "done", raw.length + " rows in sheet \"" + wb.SheetNames[0] + "\"");
    step(1, "active");
    const { map, added } = headerMap(headers);
    const present = new Set(Object.values(map));
    const missing = REQUIRED.filter(r => !present.has(r));
    if (missing.length){ step(1, "fail", "Missing required column(s): " + missing.join(", ") + ". Add them to row 1 and upload again."); throw new Error("stop"); }
    const notes = [];
    if (!present.has("Candidate ID")) notes.push("no Candidate ID column, so IDs are created automatically");
    if (!present.has("Candidate Status")) notes.push("no status column, so new candidates get \"" + (S.settings.defaultStatus || "Application Received") + "\"");
    if (added.length) notes.push("new columns added: " + added.join(", "));
    step(1, "done", notes.length ? "Found. Note: " + notes.join("; ") : "All columns found");
    const norm = raw.map(r => normalizeRow(r, map)).filter(r => Object.values(r).some(v => String(v).trim()));
    const ided = assignIds(norm); const rows = ided.rows;
    step(2, "active");
    const bad = rows.filter(r => !validEmail(r["Email ID"])), fixed = rows.filter(r => r._emailFixed);
    step(2, "done", [fixed.length ? fixed.length + " address(es) cleaned automatically" : "", bad.length ? bad.length + " blank or invalid (kept, but they can't be emailed; filter \"Invalid email\" in Candidates to fix them)" : "", ided.dupRows ? ided.dupRows + " repeat entries of the same person merged (latest entry kept)" : ""].filter(Boolean).join("; ") || "All addresses look valid");
    step(3, "active"); await sleep(120);
    const result = ingest(rows, { baseline, hold, uploadId, source: file.name });
    result.rep.dupRows = ided.dupRows; result.rep.total = norm.length;
    if (!baseline && autoOn() && canSend() && result.toSend.length > 50 && !confirm(result.toSend.length + " emails are about to be sent automatically" + (batchOn() ? ", " + batchSize() + " every " + (+S.settings.batchMinutes || 5) + " min (" + queueEta(result.toSend.length) + ")" : "") + ". Go ahead?\n\nChoose Cancel to keep them in the approval queue instead.")) result.holdAuto = true;
    step(3, "done", baseline ? "Saved as starting point; no emails will be sent" : hold ? "Saved. No emails yet: you choose who gets one" : "Compared with " + Math.max(0, Object.keys(S.candidates).length - result.rep.newC) + " saved candidates");
    step(4, "done", result.rep.newC + " new"); step(5, "done", result.rep.changes + " changed");
    step(6, "done", result.entries.filter(e => e.templateId).length + " matched" + (result.rep.noTemplate ? ", " + result.rep.noTemplate + " without a template" : ""));
    step(7, "done", result.toSend.length + " ready" + (result.rep.dup ? ", " + result.rep.dup + " duplicates prevented" : ""));
    await finishSend(result, 8);
    S.lastReport = Object.assign({ file: file.name, ts: Date.now(), uploadId, mode }, result.rep);
    step(9, "done", "Candidate email columns updated"); step(10, "active");
    await save("candidates", "columns", "log", "history", "schedule", "updates", "lastReport", "idMap", "idSeq");
    step(10, "done", "Saved");
    $("#stepOut").innerHTML = '<h2 style="margin-top:16px">' + (hold ? "Upload saved" : "Email automation completed") + '</h2>' + reportHtml(result.rep) + '<div class="toolbar" style="margin-top:14px">' + (result.rep.held ? '<button class="btn primary" data-act="pickUpload" data-kind="__lastAll">Choose who gets the email (' + result.rep.held + ')</button>' : "") + (result.rep.pending ? '<a class="btn primary" href="#/queue" data-act="close">Review ' + result.rep.pending + ' in approval queue</a>' : "") + (result.rep.queued ? '<a class="btn primary" href="#/queue" data-act="close">Watch the sending queue (' + result.rep.queued + ')</a>' : "") + '<button class="btn" data-act="exportCands">Download updated Excel</button><a class="btn" href="#/log" data-act="close">Open email log</a></div>';
  } catch (e){
    if (e.message !== "stop"){ console.error(e); $("#stepOut").innerHTML = '<div class="notice err">This file could not be read: ' + esc(e.message) + '. Check that it is a valid .xlsx file.</div>'; }
  } finally { UI.busy = false; $("#stepClose").disabled = false; renderAll(); }
}
async function finishSend(result, stepIdx){
  const r = result.rep;
  if (result.rep.held){ step(stepIdx, "done", "Not sent: " + result.rep.held + " candidate(s) are waiting for you to choose in Candidates"); return; }
  if (!result.toSend.length){ step(stepIdx, "done", "Nothing new to send"); return; }
  if (autoOn() && canSend() && !result.holdAuto){
    if (batchOn() || !outlookReady() || !isSender()){
      await dispatch(result.toSend); r.queued = result.toSend.length;
      step(stepIdx, "done", r.queued + " email(s) added to the sending queue: " + batchSize() + " every " + (+S.settings.batchMinutes || 5) + " min, all sent in " + queueEta(r.queued) + ". Keep the page open.");
      return;
    }
    step(stepIdx, "active", "Sending 0 of " + result.toSend.length);
    await sendMany(result.toSend, (i, n) => step(stepIdx, "active", "Sending " + i + " of " + n));
    r.sent = result.toSend.filter(e => e.emailStatus === "Sent").length;
    r.failed = result.toSend.filter(e => e.emailStatus === "Failed").length;
    r.dup += result.toSend.filter(e => e.emailStatus === "Duplicate Prevented").length;
    step(stepIdx, r.failed ? "fail" : "done", r.sent + " sent" + (r.failed ? ", " + r.failed + " failed (see Email log to retry)" : ""));
  } else {
    r.pending = result.toSend.length;
    step(stepIdx, "done", autoOn() ? "Outlook is not connected; " + r.pending + " email(s) are waiting in the approval queue" : r.pending + " email(s) added to the approval queue");
  }
}
async function runIngest(rows, opts){
  const result = ingest(rows, opts);
  if (autoOn() && canSend() && result.toSend.length){ await dispatch(result.toSend); }
  await save("candidates", "columns", "log", "history", "schedule", "updates");
  const e = result.entries[0];
  if (!result.entries.length) toast("Candidate saved. No status change, so no email was prepared.", "ok");
  else if (e.emailStatus === "Sent") toast("Saved and emailed " + e.to + ".", "ok");
  else if (e.emailStatus === "Pending") toast("Saved. The email is waiting in the approval queue.", "ok");
  else if (e.emailStatus === "Queued") toast("Saved. The email is in the sending queue and goes out with the next batch.", "ok");
  else toast("Saved. Email " + e.emailStatus.toLowerCase() + ": " + (e.error || ""), e.emailStatus === "Failed" ? "err" : "");
  renderAll();
}

/* Apply a style (e.g. font size) to exactly the selected text: each selected piece of text gets its own
   span, so the new size always wins over any size around it, across lines, bullets and bold text. */
function styleSelection(prop, value){
  const r = $("#tRich"), sel = getSelection();
  let range = sel.rangeCount && r.contains(sel.getRangeAt(0).commonAncestorContainer) ? sel.getRangeAt(0) : UI.tpl.range;
  if (!range || range.collapsed || !r.contains(range.commonAncestorContainer)){ toast("Select the text first, then choose the size."); return; }
  const sc = range.startContainer, so = range.startOffset, ec = range.endContainer, eo = range.endOffset;
  const nodes = [], w = document.createTreeWalker(r, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) if (n.nodeValue.length && range.intersectsNode(n)) nodes.push(n);
  const spans = [];
  for (const t of nodes){
    const start = t === sc ? so : 0, end = t === ec ? eo : t.nodeValue.length;
    if (start >= end) continue;
    if (!t.nodeValue.slice(start, end).trim() && /^(UL|OL|TABLE|TBODY|THEAD|TR)$/.test(t.parentNode.nodeName)) continue;
    if (end < t.nodeValue.length) t.splitText(end);
    const target = start > 0 ? t.splitText(start) : t;
    const par = target.parentNode;
    let span;
    if (par.nodeName === "SPAN" && par.childNodes.length === 1) span = par;
    else { span = document.createElement("span"); par.insertBefore(span, target); span.appendChild(target); }
    span.style[prop] = value; spans.push(span);
  }
  // A list item whose whole text was resized: size its bullet too
  r.querySelectorAll("li").forEach(li => { const txt = li.textContent.trim(); if (txt && spans.some(s => li.contains(s)) && [...li.childNodes].every(c => c.nodeName === "UL" || c.nodeName === "OL" || !c.textContent.trim() || spans.some(s => c === s || c.contains(s)) || [...c.querySelectorAll ? c.querySelectorAll("span") : []].some(x => spans.includes(x)))) li.style[prop] = value; });
  if (spans.length){ const nr = document.createRange(); nr.setStartBefore(spans[0]); nr.setEndAfter(spans[spans.length - 1]); sel.removeAllRanges(); sel.addRange(nr); UI.tpl.range = nr.cloneRange(); }
}

async function saveTemplate(){
  const t = tplCurrent();
  if (!t.name || !t.subject.trim()){ toast("Give the template a name and a subject.", "err"); return; }
  if (S.templates.find(x => x.id !== t.id && sameStatus(x.name, t.name))){ toast("Another template already uses this name.", "err"); return; }
  t.updatedAt = Date.now();
  const i = S.templates.findIndex(x => x.id === t.id); if (i >= 0) S.templates[i] = t; else S.templates.push(t);

  S.statuses.forEach(s => { if (ticked.includes(s.name)) s.templateId = t.id; else if (s.templateId === t.id) s.templateId = ""; });

  stDel: async d => { if (!guard("configure")) return; const st = S.statuses[+d.i]; if (!confirm("Remove status \"" + st.name + "\"? Candidates with this status keep it, but no email is sent for it.")) return; S.statuses.splice(+d.i, 1); await save("statuses"); renderAll(); },
  stAdd: async () => { if (!guard("configure")) return; const v = $("#newStatus").value.trim(); if (!v) return; if (S.statuses.some(s => sameStatus(s.name, v))){ toast("That status already exists.", "err"); return; } S.statuses.push({ name: v, templateId: "", active: true }); await save("statuses"); renderAll(); },
  remSave: async () => { if (!guard("configure")) return; const s = S.settings; s.reminderEnabled = $("#remOn").checked; s.reminderDays = Math.max(0, +$("#remDays").value || 0); s.reminderTime = $("#remTime").value || "09:00"; S.schedule.forEach(r => { if (r.status === "Scheduled") r.dueAt = reminderDue(r.iso); }); Object.values(S.candidates).forEach(syncSchedule); await save("settings", "schedule"); toast("Reminder rule saved.", "ok"); renderAll(); tick(); },
  signOut: async () => { if (CLOUD.pending.size){ await cloudPush(); } await CLOUD.sb.auth.signOut(); location.reload(); },
  takeSender: async () => { if (!outlookReady()){ toast("Connect Outlook on this computer first.", "err"); return; } PC.noSend = false; savePC(); await senderHeartbeat(true); toast(isSender() ? "This computer now sends the emails." : "Could not switch; try again.", isSender() ? "ok" : "err"); runQueue(); renderAll(); },
  saveBatch: async () => { if (!guard("configure")) return; const s = S.settings; s.batchEnabled = $("#bOn").checked; s.batchSize = Math.max(1, Math.min(500, +$("#bSize").value || 200)); s.batchMinutes = Math.max(1, Math.min(120, +$("#bMin").value || 5)); s.dailyCap = Math.max(1, Math.min(10000, +$("#bCap").value || 10000)); await save("settings"); toast("Sending speed saved: " + s.batchSize + " every " + s.batchMinutes + " min.", "ok"); renderAll(); },
  qPause: async () => { S.settings.queuePaused = true; await save("settings"); toast("Sending paused. The current email finishes, then it stops."); renderQueueStatus(); renderTop(); },
  qResume: async () => { S.settings.queuePaused = false; await save("settings"); toast("Sending resumed.", "ok"); renderQueueStatus(); runQueue(); },
  qNow: async () => { S.settings.windowStart = 0; S.settings.windowCount = 0; S.settings.holdUntil = 0; await save("settings"); runQueue(); },
  qShow: () => { UI.logStatus = "Queued"; },
  saveDefaults: async () => { if (!guard("configure")) return; S.settings.defaultStatus = $("#defStatus").value; S.settings.interviewVenue = $("#defVenue").value.trim(); await save("settings"); toast("Defaults saved.", "ok"); },
  bulkStatus: () => {
    if (!guard("operate")) return;
    const ids = selectedIds();
    if (!ids.length){ toast("Tick the candidates first, or use the box in the header to select everyone shown."); return; }
    openModal(mHead("Change status of " + ids.length + " candidate(s)") + '<div class="m-body"><div class="field"><label for="bulkSt">New status</label><select id="bulkSt">' + S.statuses.map(s => '<option>' + esc(s.name) + '</option>').join("") + '</select></div><div class="fgrid"><div class="field"><label for="bulkDate">Interview date (optional)</label><input type="date" id="bulkDate"></div><div class="field"><label for="bulkTime">Interview time (optional)</label><input type="time" id="bulkTime"></div></div><div class="notice info">The matching email for each candidate is ' + (autoOn() ? "sent automatically." : "added to the approval queue.") + ' Candidates without a valid email are updated but skipped for email.</div></div><div class="m-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="bulkApply" data-ids="' + esc(ids.join("|")) + '">Change status</button></div>');
  },
  bulkEmail: () => {
    if (!guard("operate")) return;
    const ids = selectedIds();
    if (!ids.length){ toast("Tick the candidates first. The box in the table header selects everyone shown."); return; }
    UI.bulkIds = ids; UI.bulkAtt = [];
    openModal(mHead("Send email to " + ids.length + " selected candidate(s)") + '<div class="m-body"><div class="ed"><div>' +
      '<div class="field"><label for="beTpl">Which email</label><select id="beTpl"><option value="">The template for each candidate\'s status (recommended)</option>' + S.templates.filter(t => t.active).map(t => '<option value="' + t.id + '">' + esc(t.name) + '</option>').join("") + '</select><div class="hint">Recommended: each person gets the email for their current status, for example Application Received for new applicants.</div></div>' +
      '<label class="check" style="margin-bottom:14px"><input type="checkbox" id="beSkip" checked> Skip anyone who already received this email</label>' +
      '<div class="field"><div class="lbl">Attachments for these emails</div><div class="att" id="beAtt"></div><div class="hint">Added to every selected email, together with any file already saved in the template. Up to 3 MB in total per email.</div></div>' +
      '<div id="beSummary"></div></div><div><div class="lbl">Preview (first candidate)</div><iframe class="mail" id="beFrame" title="Email preview" sandbox="" style="height:380px"></iframe></div></div></div>' +
      '<div class="m-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="bulkEmailGo" id="beGo">Send</button></div>', true);
    const refresh = () => {
      const pl = planBulk();
      $("#beSummary").innerHTML = '<div class="notice ' + (pl.send.length ? "ok" : "warn") + '"><strong>' + pl.send.length + '</strong> candidate(s) will get the email.' +
        (pl.dup ? '<br>' + pl.dup + ' skipped: already received it (or it is already waiting to be sent).' : '') + (pl.invalid ? '<br>' + pl.invalid + ' skipped: email address missing or invalid.' : '') + (pl.noTpl ? '<br>' + pl.noTpl + ' skipped: their status has no active template.' : '') + '</div>' +
        '<p class="small muted">Emails go straight to sending (they don\'t wait in the approval queue)' + (batchOn() ? ', ' + batchSize() + ' every ' + (+S.settings.batchMinutes || 5) + ' min' + (pl.send.length ? ', all sent in ' + queueEta(pl.send.length) : '') : '') + '. ' + esc(CLOUD.on ? senderText() : '') + '</p>';
      const go = $("#beGo"); go.disabled = !pl.send.length; go.textContent = pl.send.length ? "Send to " + pl.send.length + " candidate(s)" : "Nothing to send";
      $("#beFrame").srcdoc = pl.send[0] ? fullHtml(pl.send[0], true) : '<p style="font-family:sans-serif;color:#666;padding:20px">Nothing to preview.</p>';
    };
    const attUi = () => {
      const tid = $("#beTpl").value, t = tid ? S.templates.find(x => x.id === tid) : null;
      const fromTpl = t ? (t.attachments || []) : [];
      $("#beAtt").innerHTML = fromTpl.map(id => S.files[id]).filter(Boolean).map(f => '<span title="Saved in the template">' + esc(f.name) + ' <small class="muted">' + kb(f.size) + ', template</small></span>').join("") +
        UI.bulkAtt.map(id => S.files[id]).filter(Boolean).map(f => '<span>' + esc(f.name) + ' <small class="muted">' + kb(f.size) + '</small><button data-act="beRmAtt" data-id="' + f.id + '" aria-label="Remove ' + esc(f.name) + '">×</button></span>').join("") +
        '<label class="btn sm" style="cursor:pointer">📎 Attach file<input type="file" id="beAttIn" class="hide" multiple></label>';
      $("#beAttIn").onchange = async ev => { for (const f of ev.target.files){ const id = await storeFile(f); if (id) UI.bulkAtt.push(id); } attUi(); refresh(); };
    };
    UI.beAttUi = attUi;
    $("#beTpl").onchange = () => { attUi(); refresh(); }; $("#beSkip").onchange = refresh; attUi(); refresh();
  },
  bulkEmailGo: async () => {
    if (!guard("operate")) return;
    if (!canSend()){ toast("Connect Outlook first.", "err"); return; }
    const pl = planBulk(); if (!pl.send.length) return;
    if (pl.send.length > 50 && !confirm(pl.send.length + " emails will be sent" + (batchOn() ? ", " + batchSize() + " every " + (+S.settings.batchMinutes || 5) + " min (" + queueEta(pl.send.length) + ")" : "") + ". Continue?")) return;
    UI.busy = false; closeModal();
    const queued = batchOn() || !outlookReady() || !isSender();
    if (!queued) toast("Sending " + pl.send.length + " email(s)…");
    await dispatch(pl.send);
    await save("log", "history", "candidates");
    const sent = pl.send.filter(e => e.emailStatus === "Sent").length, failed = pl.send.filter(e => e.emailStatus === "Failed").length;
    toast(queued ? pl.send.length + " email(s) added to the sending queue." : sent + " sent" + (failed ? ", " + failed + " failed (see Email log)" : "") + ".", failed ? "err" : "ok");
    renderAll();
  },
  beRmAtt: d => { UI.bulkAtt = UI.bulkAtt.filter(x => x !== d.id); if (UI.beAttUi) UI.beAttUi(); const ev = $("#beSkip"); if (ev) ev.dispatchEvent(new Event("change")); },
  pickUpload: d => { UI.candStatus = d.kind || "__lastAll"; UI.candSearch = ""; UI.busy = false; closeModal(); if (page() === "candidates") renderAll(); else go("candidates"); },
  selAllMatch: () => { UI.selAllMatch = true; $$(".csel").forEach(c => c.checked = true); const a = $("#candAll"); if (a) a.checked = true; updateSelInfo(); },
  selClear: () => { UI.selAllMatch = false; $$(".csel").forEach(c => c.checked = false); const a = $("#candAll"); if (a) a.checked = false; updateSelInfo(); },
  bulkApply: async d => {
    const ids = d.ids.split("|"), st = $("#bulkSt").value, iso = $("#bulkDate").value, tm = $("#bulkTime").value;
    const rows = ids.map(id => { const c = S.candidates[id]; const r = { "Candidate ID": id, "Candidate Name": c["Candidate Name"], "Email ID": c["Email ID"], "Candidate Status": st }; if (iso){ r["Interview Date"] = fmtDate(toDate(iso)); r._iso = iso; } if (tm) r["Interview Time"] = toTime(tm); return r; });
    if (rows.length > 50 && autoOn() && !confirm(rows.length + " emails will be sent automatically" + (batchOn() ? " (" + batchSize() + " every " + (+S.settings.batchMinutes || 5) + " min)" : "") + ". Continue?")) return;
    UI.busy = false; closeModal(); toast("Updating " + rows.length + " candidate(s)…");
    const result = ingest(rows, { source: "Bulk status change" });
    if (autoOn() && canSend() && result.toSend.length) await dispatch(result.toSend);
    await save("candidates", "log", "history", "schedule", "updates");
    const qd = result.entries.filter(e => e.emailStatus === "Queued").length, sent = result.entries.filter(e => e.emailStatus === "Sent").length, pend = result.entries.filter(e => e.emailStatus === "Pending").length, skip = result.entries.filter(e => e.emailStatus === "Skipped" || e.emailStatus === "Duplicate Prevented").length;
    toast(rows.length + " updated to " + st + ". " + (sent ? sent + " emailed. " : "") + (qd ? qd + " added to the sending queue. " : "") + (pend ? pend + " waiting for approval. " : "") + (skip ? skip + " skipped (see Email log)." : ""), "ok");
    renderAll();
  },
  remCancel: async d => { const r = S.schedule.find(x => x.id === d.id); r.status = "Cancelled"; r.note = "Cancelled by HR"; await save("schedule"); renderAll(); },
  saveCompany: async () => { if (!guard("admin")) return; const s = S.settings; s.companyName = $("#sCompany").value.trim(); s.senderName = $("#sSender").value.trim(); s.hrName = $("#sHrName").value.trim(); s.hrMobile = $("#sHrMobile").value.trim(); s.hrEmail = $("#sHrEmail").value.trim(); s.address = $("#sAddress").value.trim(); s.signature = $("#sSig").value; await save("settings"); toast("Company details saved.", "ok"); renderAll(); },
  logoReset: async () => { S.settings.logo = LOGO_DEFAULT; await save("settings"); renderAll(); },
  saveOutlook: async () => { if (!guard("admin")) return; const s = S.settings; const changed = s.clientId !== $("#sClient").value.trim() || s.tenant !== ($("#sTenant").value.trim() || "common"); s.clientId = $("#sClient").value.trim(); s.tenant = $("#sTenant").value.trim() || "common"; s.simulate = $("#sSim").checked; if (!s.simulate && (changed || s.testWasSim)){ s.testPassed = false; if (s.mode === "auto"){ s.mode = "approval"; toast("Approval mode is back on. Send a real test email before using Auto mode.", ""); } } await save("settings"); await initMsal(); toast("Connection settings saved." + (!s.simulate && !account ? " Now click Connect Outlook." : ""), "ok"); renderAll(); },
  userAdd: async () => { if (!guard("admin")) return; const em = $("#uEmail").value.trim().toLowerCase(), role = $("#uRole").value; if (!validEmail(em)){ toast("Enter a valid email address.", "err"); return; }
    const me = myEmail();
    if (!S.users.length){ if (!me){ toast((CLOUD.on ? "Sign in" : "Connect Outlook") + " first, so your own account can be added as Admin.", "err"); return; } if (em !== me || role !== "Admin"){ S.users.push({ email: me, role: "Admin" }); toast("Added you (" + me + ") as Admin first.", "ok"); } }
    if (S.users.some(u => u.email === em)){ toast("That user is already listed.", "err"); } else S.users.push({ email: em, role });
    await save("users"); renderAll(); },
  userRole: async (d, el) => { if (!guard("admin")) return; const u = S.users[+d.i]; if (u.role === "Admin" && el.value !== "Admin" && S.users.filter(x => x.role === "Admin").length === 1){ toast("Keep at least one Admin.", "err"); el.value = "Admin"; return; } u.role = el.value; await save("users"); renderAll(); },
  userDel: async d => { if (!guard("admin")) return; const u = S.users[+d.i]; if (u.role === "Admin" && S.users.filter(x => x.role === "Admin").length === 1 && S.users.length > 1){ toast("Keep at least one Admin.", "err"); return; } S.users.splice(+d.i, 1); await save("users"); renderAll(); },
  backup: () => { const data = {}; KEYS.forEach(k => data[k] = S[k]); download("recruitment-mailer-backup-" + isoDay(new Date()) + ".json", new Blob([JSON.stringify({ app: "wc-recruitment-mailer", v: 1, at: Date.now(), data })], { type: "application/json" })); },
  reset: async () => { if (!guard("admin")) return;
    if (prompt(CLOUD.on ? "This erases ALL candidates, templates, history and the email log in the SHARED database, for every HR computer. Type ERASE to confirm." : "This erases all candidates, templates, history and the email log in this browser. Type ERASE to confirm.") !== "ERASE") return;
    if (CLOUD.on){ for (const t of ["wc_candidates","wc_email_log"]) await CLOUD.sb.from(t).delete().neq("id", ""); await CLOUD.sb.from("wc_kv").delete().neq("key", "meta"); }
    await DB.clear(); location.reload(); }
};
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act; if (!ACT[a]) return;
  if (b.tagName === "INPUT" || b.tagName === "SELECT") return; // handled on change
  if (b.tagName === "A" && a === "close"){ closeModal(); return; }
  if (b.tagName === "A" && a === "qShow"){ UI.logStatus = "Queued"; if (page() === "log") renderAll(); return; }
  ev.preventDefault(); ACT[a](b.dataset, b, ev);
});
document.addEventListener("change", ev => {
  const b = ev.target.closest("[data-act]");
  if (b && (b.tagName === "INPUT" || b.tagName === "SELECT") && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset, b, ev);
  if (ev.target.id === "sLogo" && ev.target.files[0]){ const f = ev.target.files[0]; if (f.size > 500 * 1024){ toast("Use a logo under 500 KB so emails stay light.", "err"); return; } readFileB64(f).then(async u => { S.settings.logo = u; await save("settings"); renderAll(); }); }
  if (ev.target.id === "restoreIn" && ev.target.files[0]){ ev.target.files[0].text().then(async t => { try { const j = JSON.parse(t); if (j.app !== "wc-recruitment-mailer") throw new Error("not a backup from this app"); if (!confirm("Replace all current data with this backup from " + fmtDT(j.at) + "?")) return; for (const k of KEYS) S[k] = j.data[k]; await persistAll(); location.reload(); } catch (e){ toast("Backup could not be restored: " + e.message, "err"); } }); }
  if (ev.target.id === "candAll"){ UI.selAllMatch = false; $$(".csel").forEach(c => c.checked = ev.target.checked); updateSelInfo(); }
  if (ev.target.classList && ev.target.classList.contains("csel")){ if (!ev.target.checked) UI.selAllMatch = false; updateSelInfo(); }
  if (ev.target.name === "upMode"){ $$('input[name="upMode"]').forEach(r => r.closest(".mode-opt").classList.toggle("on", r.checked)); }
  if (ev.target.id === "candStatus"){ UI.candStatus = ev.target.value; renderCandRows(); }
  if (ev.target.id === "logStatus"){ UI.logStatus = ev.target.value; renderLogRows(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "candSearch"){ UI.candSearch = ev.target.value; renderCandRows(); }
  if (ev.target.id === "logSearch"){ UI.logSearch = ev.target.value; renderLogRows(); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && $("#modalBack").classList.contains("open")) closeModal(); });
$("#modalBack").addEventListener("mousedown", ev => { if (ev.target.id === "modalBack") closeModal(); });
$("#menuBtn").onclick = () => $("#side").classList.toggle("open");
window.addEventListener("hashchange", () => { closeModal(); renderAll(); window.scrollTo(0, 0); });

/* ---------- start ---------- */
(async function start(){
  try { await loadState(); }
  catch (e){ document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif">This browser blocked local storage (' + esc(e.message) + '). Open the app in a normal (not private) window of Edge or Chrome.</div>'; return; }
  if (cloudConfigured()){
    try {
      CLOUD.sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "wc-recruitment-auth" } });
      const { data } = await CLOUD.sb.auth.getSession();
      if (!data.session) await signInGate();
      CLOUD.user = (await CLOUD.sb.auth.getUser()).data.user;
      if (!(await cloudLoad())) return;
    } catch (e){
      console.error(e);
      document.body.insertAdjacentHTML("beforeend", '<div class="gate"><div class="gate-card"><h2>Can\'t reach the shared database</h2><p class="muted">' + esc(e.message || String(e)) + '</p><p class="muted small">Check the internet connection, the values in config.js, and that supabase_setup.sql was run. Then reload.</p><button class="btn primary" onclick="location.reload()">Reload</button></div></div>');
      return;
    }
  }
  await initMsal();
  renderAll();
  if (CLOUD.on){
    await senderHeartbeat(); setInterval(() => senderHeartbeat(), 30 * 1000);
    setInterval(async () => {
      if (await cloudPull(false)){
        const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if (!$("#modalBack").classList.contains("open") && !typing && !Q.running) renderAll(); else { renderNav(); renderTop(); }
        setTimeout(runQueue, 500);
      }
    }, 20 * 1000);
  }
  tick(); setInterval(tick, 60 * 1000);
  setTimeout(runQueue, 1500); setInterval(runQueue, 15 * 1000);
  setInterval(() => { if (!Q.running && queuedList().length) renderQueueStatus(); }, 30 * 1000);
  window.addEventListener("beforeunload", ev => { if (CLOUD.pending.size || CLOUD.pushing || (isSender() && (Q.running || (queuedList().length && !S.settings.queuePaused)))){ ev.preventDefault(); ev.returnValue = "Emails are still being sent. If you close this page, sending pauses until you open it again."; } });
})();
</script>
</body>
